; TasomachiVR - loader settings.
; Read by dsound.dll when the game starts.

; 0 disables the mod entirely: the game boots flat and nothing is loaded.
Enabled=1

; VR runtime to load: openxr_loader.dll or openvr_api.dll
Runtime=openxr_loader.dll

; Launching through Steam while SteamVR is running hands the game an XR_RUNTIME_JSON
; pointing at SteamVR, so SteamVR is the runtime even if your machine is set to
; another one. That is also why SteamVR shows the game in its desktop theatre and
; asks you to click "Resume game" once the mod switches it to VR.
;
; 0 (default) = leave it alone. SteamVR stays the runtime, which is what most people
;               launching from Steam expect. You get the theatre prompt.
; 1           = ignore the override and use whatever OpenXR runtime your system is
;               configured for. This removes the theatre prompt entirely, but it
;               changes which runtime you go through - only set it if that is what
;               you want.
;
; Setting 1 cannot leave you without VR: the loader checks that a system runtime is
; both registered and present on disk before dropping the inherited one, and keeps
; SteamVR otherwise. TasomachiVR.log always records which runtime ended up in use.
UseSystemOpenXrRuntime=0

; Pin one specific runtime by full path to its .json. Takes priority over the setting
; above, and is ignored if the file does not exist. Leave empty for normal use.
; Examples:
;   C:\Program Files\Oculus\Support\oculus-runtime\oculus_openxr_64.json
;   C:\Program Files\Virtual Desktop Streamer\OpenXR\virtualdesktop-openxr.json
OpenXrRuntimeJson=

; Neutralise the engine's own VR plugins before it ever looks for them.
Nullify=1

; Stops UE4 muting the game when its window loses focus to SteamVR. Writes
; [Audio] UnfocusedVolumeMultiplier=1.0 into the game's Engine.ini
; (%LOCALAPPDATA%\tasomachi\Saved\Config\WindowsNoEditor\Engine.ini).
FixUnfocusedAudio=1

; Start with the UEVR menu closed instead of opening it on every launch.
; It stays available at any time: Insert key, or L3+R3 on a gamepad.
StartWithMenuClosed=1

; How long to wait for the game window before loading UEVR anyway.
WindowWaitTimeoutMs=120000

; Extra delay after the window appears, before the VR runtime and UEVR are loaded.
; It shortens the window during which the game is still a flat app, which is what
; SteamVR reacts to by showing its desktop theatre and asking you to resume.
; Raise it (10000, 15000) if UEVR loads too early and the game crashes on startup.
PostWindowDelayMs=1500

; Bump to force the profile to be re-deployed into %APPDATA%. This overwrites
; the player's own settings, so only change it for a real update.
ProfileVersion=4

; --- VR rendering --------------------------------------------------------------
; Unlike a lot of UE4 games, Tasomachi does not undersample: it renders at 100%
; and has no spatial upscaler, so nothing here needs fixing for VR. Left at 0,
; the two keys below are ignored and NOTHING is written to the game's Engine.ini,
; which is also why uninstalling leaves no rendering overrides behind.
;
; Set to 1 only if you want to use them.
ApplyRenderingOverrides=0

; Internal resolution percentage. 0 = leave the game alone (it runs at 100%).
; Lower it (85, 75...) if the framerate struggles.
ScreenPercentage=0

; Anti-aliasing: -1 = leave the game's choice alone (it ships with TAA).
; 0 = none, 1 = FXAA, 2 = TAA.
; TAA is what causes ghosting in VR, so 1 or 0 is worth trying - but removing it
; makes fine detail shimmer, and which one hurts less is yours to judge.
AntiAliasing=-1

; ============================================================================
; Everything below is read by the C++ plugin, re-read about once a second, so
; these apply while the game is running - no restart needed.
; ============================================================================

; --- Eye placement -------------------------------------------------------------
; NOTE: these offsets ADD to UEVR's own (menu Insert -> Camera Offset, keys
; VR_CameraForwardOffset / RightOffset / UpOffset in the profile's config.txt).
; They do not behave identically in pitch: this one stays horizontal (it follows
; yaw only), while UEVR's follows the view direction.
ForwardOffset=10
; The Head bone sits at the base of the skull, so eye level is a little above it.
UpOffset=6

; --- Body orientation ----------------------------------------------------------
; YawSign: -1 or 1. Flip it if the character turns the opposite way to your head.
YawSign=-1
; YawOffset: constant offset in degrees, if the body sits crooked.
YawOffset=0

; Make the character face where you look, and strafe instead of pivoting to face
; her direction of travel. Only ever applied on foot: the flying boat steers
; itself and never reads ControlRotation, so the left stick keeps steering it
; while your head only looks around.
ApplyBodyYaw=1

; The body snaps onto the headset yaw every tick (bUseControllerRotationYaw), and a headset
; is never perfectly still - it reports a fraction of a degree of noise even sitting on a
; desk. Fed in raw, that rotates the whole character every single frame, which is the
; trembling. Below this many degrees of change the last value is held instead, giving the
; body a resting state. Above it, tracking is continuous, so a deliberate turn is never
; stepped. Raise it if the body still shimmers; lower it if slow turns feel notchy.
BodyYawDeadzone=0.35

; Discard the game's camera orientation and use the headset instead. 0 gives the
; game its own camera angles back, which is only useful for diagnosing.
WriteViewRot=1

; --- Turning -------------------------------------------------------------------
; All four of these are on the in-game menu (X+Y), which is the easier way to feel
; them out. Editing here works too - the file is re-read about once a second.
; 0 = snap, 1 = smooth. Smooth turning is a reliable way to feel sick, so snap is
; the default; SmoothTurnSpeed is in degrees per second.
TurnMode=0
SmoothTurnSpeed=90
TurnDeadzone=0.2

; SnapTurn also owns hiding the right stick from the game. Both pawns bind it to
; their own camera, so with this at 0 the game would fight your head every frame.
SnapTurn=1
SnapAngle=45
SnapThreshold=0.5
SnapRelease=0.3
; Seconds to wait between two snaps. Lower feels snappier, higher feels safer.
SnapCooldown=0.3

; --- Pause ---------------------------------------------------------------------
; The game binds its pause menu to Gamepad_Special_Right, which is XInput START,
; and nothing on a Touch controller reaches it. The plugin presses START while
; this VR button is held.
; 0 = off, 1 = left menu button, 2 = left stick click, 3 = right stick click
; Stick click rather than a grip: grips stay held while playing, so a grip would
; pause by accident. Note that UEVR uses L3+R3 together for its own menu, and the
; game already uses L3 on foot (RunPad), which leaves the right stick click.
PauseButton=3

; --- The eye -------------------------------------------------------------------
; The eye follows the HEAD BONE, filtered. Anchoring it on something rigid instead was
; right while the body was invisible and became wrong the moment the body was drawn: the
; body is animated relative to any rigid anchor, so it slid while walking and overtook
; the camera on a jump.
;
; The bob is removed by a low-pass with a HARD LIMIT - the filtered eye may never sit
; further than EyeSwayLimit from where the head really is. Small oscillations, like the
; ~5 Hz walk cycle, are damped away; a jump or a crouch exceeds the limit at once and is
; followed exactly. A plain low-pass cannot do both, and that clamp is what separates the
; two regimes. Lower EyeBobDamping to damp harder, lower EyeSwayLimit to damp for longer
; before giving up.
EyeStabilise=1
EyeBobDamping=9
EyeSwayDamping=22
EyeSwayLimit=4

; Holds the view at a wall rather than letting you lean your head through a partition.
; The roomscale move sweeps the capsule, so the body cannot walk through geometry - but
; nothing stopped the head. A sphere is swept from the neck out to the wanted eye
; position, and the distance to the obstruction is found by halving the segment six times
; rather than by reading the hit result: FHitResult is a large struct whose field offsets
; would have to be guessed, and a blocked-or-not answer is all that is needed.
; EyeTraceChannel is an ETraceTypeQuery, which is an INDEX into the project's trace channel
; list and not a collision channel number: 0 = Visibility, 1 = Camera. This was documented
; here as 1 and 2 and set to 2, which is out of range - the engine maps it to ECC_MAX and
; the trace can never hit anything. That, and not the choice of channel, is why the head
; went through walls all session.
; Visibility is also the correct channel on the merits: the Pawn and CharacterMesh collision
; profiles both ignore it, so your own capsule and body cannot block your view.
EyeCollide=1
EyeProbeRadius=12
EyeWallMargin=3
EyeTraceChannel=0

; --- Roomscale -----------------------------------------------------------------
; Your own steps move the character. Physically walk half a metre and she walks it too,
; capsule collisions included, so you cannot step through a wall.
;
; The part that is not obvious: displacing the body by the headset's movement makes the
; movement count TWICE, because the view already follows your head. So the mod also
; shifts UEVR's standing origin by however far the body ACTUALLY travelled - measured
; after the move, not requested before it, which is what stops your view walking through
; geometry your body was blocked by.
;
; On foot only. The flying boat is a pawn too, and displacing it would sail the boat with
; your footsteps.
; Leave UEVR's own VR_RoomscaleMovement off: the two would fight.
Roomscale=0

; Centimetres in one frame. A tracking glitch or a recentre can produce a metre at once,
; and teleporting the character across the room is worse than losing a step.
RoomscaleMaxStep=25

; Which yaw maps your tracking space onto the world.
; The first version used the VIEW yaw, and that was wrong: the view yaw contains the
; headset's own yaw, which is part of the POSE rather than of the mapping between the two
; spaces. The mapping is the world rotation the mod applies itself - the snap-turn yaw
; alone. With the view yaw in there, the direction of a step depended on where you were
; looking, which is why walking forward could feel like walking backwards.
; It is a setting and not a silent fix because the earlier evidence could not tell the two
; apart: every yaw in that log sat between -5 and +7 degrees, where they are identical.
;   0 = snap yaw (the reasoned answer)    1 = view yaw (the old behaviour)
RoomscaleYawSource=0

; The compensation that stops the movement counting twice.
;   1 = normal    -1 = inverted    0 = off, which shows the raw double movement
; Three values, three distinct symptoms, so one run can identify which is happening.
RoomscaleCompensate=1

; --- Your own body ---------------------------------------------------------------
; UE4 visibility is per primitive, never per bone, so a first person body is always a
; compromise:
;   0 = the whole mesh is hidden. Nothing of the character is drawn, but
;       bCastHiddenShadow keeps her shadow complete and correct. No neck seam, no
;       chest clipping when you look down - and no body either.
;   1 = the body is drawn with the head bone collapsed in the skinning. The whole
;       hair chain is parented to Head and goes with it. The cost is that the shadow
;       loses its head too: nothing can drop one bone from the base pass only.
; Either way the character is restored whole during cutscenes.
; Also a row on the VR settings page, so you can compare them in the headset.
BodyMode=1

; Frames between two diagnostic lines in the UEVR log.
LogEvery=240

; --- In-game menu ---------------------------------------------------------------
; The menu is built into the game's own pause menu, as a "VR SETTINGS" entry with its
; own page. UMG is the layer UEVR projects into the headset - the one surface the game
; itself proves is visible - so the page is not drawn: it is made of the same widget
; classes the game uses, in the same widget tree, and it borrows the game's own button
; style, font and colour. It is navigated with the controller, like the rest of the
; pause menu.
;
; Rows: snap angle, smooth turn, turn speed, eye forward, eye height, yaw trim,
; show body. They
; are only read while the page is open, so the values below still apply the rest of
; the time. Changes take effect immediately but are NOT written back here, so they
; last for the session only.
;
; The widget is rebuilt on every pause, because the game creates a fresh instance
; each time it opens.
GraftPauseMenu=1

; Navigating the VR page with a thumbstick. Slate reads the left stick directly and raw it
; is unusable: a stick rests slightly off-centre, crosses Slate's own 0.5 threshold on the
; way through the middle, and repeats as fast as XInput is polled - several times per frame,
; not per tick. So the stick is filtered while this page is open, and only while it is open:
;   MenuDeadzone  below this nothing is emitted at all, which kills resting drift.
;   MenuRepeatMs  the interval between steps when the stick is held. Higher = slower.
; A push is also locked to its dominant axis, so a diagonal cannot change the highlighted
; row and the value of a slider at the same time - which was most of what made it feel
; uncontrollable. Raise both numbers if it still runs away; lower MenuRepeatMs if dragging a
; slider from one end to the other feels slow.
MenuDeadzone=0.62
MenuRepeatMs=260

; Writes the live widget tree of WBP_PauseMenu and WBP_HUD to the UEVR log - names,
; classes, visibility and child counts. UMG is the layer UEVR projects into the
; headset, so it is the one surface the game itself proves is visible; this is the
; measurement that says where a menu can be attached. Retried twice a second until
; the widgets exist, so open the pause menu once with this on.
WidgetProbe=0

; Logs what this build actually exposes for the articulated-arms work, once:
;   * UPoseableMeshComponent with CopyPoseFromSkeletalComponent and SetBoneTransformByName
;     - the plan is to keep the game's animated mesh hidden and driving the pose, and
;     override the arms on a visible poseable copy
;   * whether a spawned component can be made live at all (AddComponentByClass arrived
;     in 4.26 and this is 4.25, so this is the real unknown)
;   * the physics fallback: simulating the arms on the existing mesh instead
; Absence is as useful as presence, so every name is reported either way.
ReflectProbe=0

; Borrows a spare ArrowComponent per hand and asks UEVR's UObjectHook to drive it from
; the motion controller, then logs where the two land relative to the head bone. That
; component's world position is the target the physics arms will chase - and reading it
; from UEVR is what avoids deriving the OpenXR-to-world mapping ourselves, which is the
; largest source of error in this kind of work.
; Requires UObjectHook_EnabledAtStartup=true in the profile, which the mod now ships.
HandProbe=0

; --- Articulated arms -----------------------------------------------------------
; Needs the patch pak that carries our post-process Animation Blueprint. See
; docs\ANIMBP.md - it explains why this is the only route that works here, and what
; the editor side has to contain.
; With Arms=0 nothing is loaded: the cost is a handful of failed lookups before the
; loader gives up.
Arms=1

; Blend of the IK against the game's own animation, 0..1.
ArmsAlpha=1.0

; Tilts the head by this many degrees through the Blueprint. It is the one number
; that separates three failures in a single launch: if the head tilts, then the pak
; mounted, the class loaded, the property was assigned, the component re-initialised,
; the instance exists and the variables are being written - so anything still wrong
; is in the IK itself. If the head does not tilt, none of that happened.
; Set 30 for the first launch, then back to 0.
ArmsDebugTilt=0

; How far her hand goes compared to yours. 1.0 puts it exactly where your hand is,
; which is what VR wants: you see the virtual hand where you feel the real one. It is
; always clamped at her real reach, measured from her own bones, so the elbow never
; locks straight at something she cannot touch.
; Below 1 keeps her hands closer in; above 1 reaches further than your arm does.
ArmsReachScale=1.0

; Constant correction on each wrist, in degrees. The hand bone's axes follow the rig's
; convention rather than the controller's, so some multiple of 90 is nearly always
; needed - which one cannot be worked out on paper, only seen.
;
; ONE PER SIDE, and that is not redundancy: a Mixamo rig carries MIRRORED local axes on
; its two hand bones, so the correction that squares up the right wrist puts the left
; one exactly wrong. Expect the left values to be negated or swapped, not equal.
;
; These are re-read about once a second, so you can edit this file WHILE THE GAME RUNS
; and watch a hand turn until it is right. Composition is done by the engine, not by the
; plugin: adding rotator components is not the same as composing rotations.
; These defaults were found in the headset, and the mirroring is visible in them: the
; same yaw on both sides, opposite pitch. That is the rig's two hand bones, not a mistake.
ArmsLeftHandOffsetPitch=-90
ArmsLeftHandOffsetYaw=90
ArmsLeftHandOffsetRoll=0
ArmsRightHandOffsetPitch=90
ArmsRightHandOffsetYaw=90
ArmsRightHandOffsetRoll=0

; Where the wrist sits relative to the controller, in centimetres along the CONTROLLER's
; own axes. A controller is held in the fist while the hand bone is at the wrist, so the
; two are never in the same place, and the gap is a constant - it is not an arm-length
; problem and rescaling the reach will not fix it.
; Negative forward pulls the hand back towards your wrist. Start there if the hands sit
; too far out in front of your real ones.
ArmsWristForward=0
ArmsWristRight=0
ArmsWristUp=0

; Which way round the controller rotation and the wrist correction are composed.
; Composed in the wrong order the correction lands in WORLD space instead of the hand's
; own frame: it looks right while you face one way and drifts as soon as you turn on the
; spot. That is what happened, so it is a setting now rather than a graph edit - the
; plugin composes it itself, through the engine's own ComposeRotators, and sends the
; Blueprint a zero offset so its own node passes the result through untouched.
;   0 = controller then offset    1 = offset then controller
ArmsComposeOrder=0

; Where the elbow is pushed, in centimetres, along HER OWN shoulder axis - the vector
; between her two shoulder bones - and how far below the arm.
; The first version of this used world axes, which silently assumed she always faced the
; same way; the moment she turned, "outwards" became arbitrary and the elbow often folded
; into her chest. Nothing here assumes her facing or her scale.
; Negate ArmsElbowOut to fold the elbows the other way.
ArmsElbowOut=25
ArmsElbowDown=10

