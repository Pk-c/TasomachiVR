; TasomachiVR - loader settings.
; Read by dsound.dll when the game starts.

; 0 disables the mod entirely: the game boots flat and nothing is loaded.
Enabled=1

; VR runtime to load: openxr_loader.dll or openvr_api.dll
Runtime=openxr_loader.dll

; Launching through Steam while SteamVR is running hands the game an XR_RUNTIME_JSON
; pointing at SteamVR, so SteamVR is the runtime even if your machine is set to
; another one. That is also why SteamVR shows the game in its desktop theatre and
; asks you to click "Resume game" once the mod switches it to VR.
;
; 0 (default) = leave it alone. SteamVR stays the runtime, which is what most people
;               launching from Steam expect. You get the theatre prompt.
; 1           = ignore the override and use whatever OpenXR runtime your system is
;               configured for. This removes the theatre prompt entirely, but it
;               changes which runtime you go through - only set it if that is what
;               you want.
;
; Setting 1 cannot leave you without VR: the loader checks that a system runtime is
; both registered and present on disk before dropping the inherited one, and keeps
; SteamVR otherwise. TasomachiVR.log always records which runtime ended up in use.
UseSystemOpenXrRuntime=0

; Pin one specific runtime by full path to its .json. Takes priority over the setting
; above, and is ignored if the file does not exist. Leave empty for normal use.
; Examples:
;   C:\Program Files\Oculus\Support\oculus-runtime\oculus_openxr_64.json
;   C:\Program Files\Virtual Desktop Streamer\OpenXR\virtualdesktop-openxr.json
OpenXrRuntimeJson=

; Neutralise the engine's own VR plugins before it ever looks for them.
Nullify=1

; Stops UE4 muting the game when its window loses focus to SteamVR. Writes
; [Audio] UnfocusedVolumeMultiplier=1.0 into the game's Engine.ini
; (%LOCALAPPDATA%\tasomachi\Saved\Config\WindowsNoEditor\Engine.ini).
FixUnfocusedAudio=1

; Start with the UEVR menu closed instead of opening it on every launch.
; It stays available at any time: Insert key, or L3+R3 on a gamepad.
StartWithMenuClosed=1

; How long to wait for the game window before loading UEVR anyway.
WindowWaitTimeoutMs=120000

; Extra delay after the window appears, before the VR runtime and UEVR are loaded.
; It shortens the window during which the game is still a flat app, which is what
; SteamVR reacts to by showing its desktop theatre and asking you to resume.
; Raise it (10000, 15000) if UEVR loads too early and the game crashes on startup.
PostWindowDelayMs=1500

; Bump to force the profile to be re-deployed into %APPDATA%. This overwrites
; the player's own settings, so only change it for a real update.
ProfileVersion=4

; --- VR rendering --------------------------------------------------------------
; Unlike a lot of UE4 games, Tasomachi does not undersample: it renders at 100%
; and has no spatial upscaler, so nothing here needs fixing for VR. Left at 0,
; the two keys below are ignored and NOTHING is written to the game's Engine.ini,
; which is also why uninstalling leaves no rendering overrides behind.
;
; Set to 1 only if you want to use them.
ApplyRenderingOverrides=0

; Internal resolution percentage. 0 = leave the game alone (it runs at 100%).
; Lower it (85, 75...) if the framerate struggles.
ScreenPercentage=0

; Anti-aliasing: -1 = leave the game's choice alone (it ships with TAA).
; 0 = none, 1 = FXAA, 2 = TAA.
; TAA is what causes ghosting in VR, so 1 or 0 is worth trying - but removing it
; makes fine detail shimmer, and which one hurts less is yours to judge.
AntiAliasing=-1

; ============================================================================
; Everything below is read by the C++ plugin, re-read about once a second, so
; these apply while the game is running - no restart needed.
; ============================================================================

; --- Eye placement -------------------------------------------------------------
; NOTE: these offsets ADD to UEVR's own (menu Insert -> Camera Offset, keys
; VR_CameraForwardOffset / RightOffset / UpOffset in the profile's config.txt).
; They do not behave identically in pitch: this one stays horizontal (it follows
; yaw only), while UEVR's follows the view direction.
ForwardOffset=20
; The Head bone sits at the base of the skull, so eye level is a little above it.
UpOffset=15

; --- Body orientation ----------------------------------------------------------
; YawSign: -1 or 1. Flip it if the character turns the opposite way to your head.
YawSign=-1
; YawOffset: constant offset in degrees, if the body sits crooked.
YawOffset=0

; Make the character face where you look, and strafe instead of pivoting to face
; her direction of travel. Only ever applied on foot: the flying boat steers
; itself and never reads ControlRotation, so the left stick keeps steering it
; while your head only looks around.
ApplyBodyYaw=1

; How fast the character's body follows the headset yaw. This is a plain low-pass and it can
; afford to be generous: the body yaw never reaches the VIEW. The stereo callback writes the
; view from the snap yaw and UEVR lays the headset rotation on top, so smoothing here settles
; her mesh and her walking direction without a millisecond of head latency.
; A deadzone was tried here first and was wrong: it does not only reject noise, it quantises
; everything, so a head turning slowly ratcheted the body round in steps of its own size.
; Higher follows faster. Lower it if the body still shimmers, raise it if it lags a turn.
BodyYawDamping=14

; Discard the game's camera orientation and use the headset instead. 0 gives the
; game its own camera angles back, which is only useful for diagnosing.
WriteViewRot=1

; --- The camera position belongs to UEVR --------------------------------------
; WriteViewPos=0 is the important one, and everything else here follows from it.
;
; This mod used to write the camera position every frame, from the character's head bone.
; That is what let the head pass through walls, and no trace could have fixed it: teleporting
; the camera bypasses collision by construction. UEVR already moves the player properly -
; sweeping the capsule, so walls stop you - but only if nothing overwrites the result.
; This is the shape the EuropaVR mod has always had: it writes the view ROTATION and never
; the position, which is why roomscale and wall collision simply work there.
; Set to 1 to go back to head-bone tracking, and accept walls being permeable with it.

; UEVR's own roomscale, written into its profile at startup. This is what actually moves you
; when you walk, with collision.
UevrRoomscale=1

; --- Turning -------------------------------------------------------------------
; All four of these are on the in-game menu (X+Y), which is the easier way to feel
; them out. Editing here works too - the file is re-read about once a second.
; 0 = snap, 1 = smooth. Smooth turning is a reliable way to feel sick, so snap is
; the default; SmoothTurnSpeed is in degrees per second.
TurnMode=0
SmoothTurnSpeed=90
TurnDeadzone=0.2

; SnapTurn also owns hiding the right stick from the game. Both pawns bind it to
; their own camera, so with this at 0 the game would fight your head every frame.
SnapTurn=1
SnapAngle=45
SnapThreshold=0.5
SnapRelease=0.3
; Seconds to wait between two snaps. Lower feels snappier, higher feels safer.
SnapCooldown=0.3

; --- Pause ---------------------------------------------------------------------
; The game binds its pause menu to Gamepad_Special_Right, which is XInput START,
; and nothing on a Touch controller reaches it. The plugin presses START while
; this VR button is held.
; 0 = off, 1 = left menu button, 2 = left stick click, 3 = right stick click
; Stick click rather than a grip: grips stay held while playing, so a grip would
; pause by accident. Note that UEVR uses L3+R3 together for its own menu, and the
; game already uses L3 on foot (RunPad), which leaves the right stick click.
PauseButton=3

; --- The eye -------------------------------------------------------------------
; The eye follows the HEAD BONE, filtered. Anchoring it on something rigid instead was
; right while the body was invisible and became wrong the moment the body was drawn: the
; body is animated relative to any rigid anchor, so it slid while walking and overtook
; the camera on a jump.
;
; The bob is removed by a low-pass with a HARD LIMIT - the filtered eye may never sit
; further than EyeSwayLimit from where the head really is. Small oscillations, like the
; ~5 Hz walk cycle, are damped away; a jump or a crouch exceeds the limit at once and is
; followed exactly. A plain low-pass cannot do both, and that clamp is what separates the
; two regimes. Lower EyeBobDamping to damp harder, lower EyeSwayLimit to damp for longer
; before giving up.

; The filter is anchored on the MESH COMPONENT, not on the world. The component is carried
; by the capsule and never animates, so walking, jumping and riding the boat reach the view
; unfiltered and only the animation's own bob is smoothed. Filtering in world space could
; not tell those apart: it damped the character's travel too, which left the view pinned
; behind you while walking and inside your chest mid-jump.
;
; The anchor itself gets a one-euro filter, whose cutoff in hertz is MinCutoff + Beta*speed.
; Standing still that is a fraction of a hertz and the view is dead calm - measured at
; 0.04 cm of movement on the worst frame; walking it is tens of hertz and the lag is under a
; centimetre. A single fixed amount of smoothing cannot do both.
; Raise MinCutoff if the view shimmers at rest; raise Beta if walking feels draggy.

; While airborne, freeze where the head sits inside the body. The jump animation curls the
; character up, dragging the head bone down and forward through the chest - that is pose,
; not head movement, and following it put the camera in the torso.

; Centimetres the eye is raised while you are in the air, eased in and out so it neither pops
; on take-off nor snaps back on landing.
;
; This is COSMETIC and does not pretend otherwise. During a jump the camera is already where
; it should be - the anchor tracks the capsule exactly and the head's position inside the body
; is held - so nothing is lagging. What still comes into view is the ANIMATION: the character
; tucks, and the knees and chest rise into a viewpoint that never moved. Lifting the eye
; passes over them.
;
; The VR page has it as "Jump lift", 0 to 80 cm in steps of 2.
; To find your value, jump a few times and read the log: each jump reports how far the
; animation dropped the head below the held position, which is what the lift has to clear.
; Too much of it feels like floating, so start under that number rather than over it.
EyeAirLift=18
EyeAirLiftSpeed=12

; Radius of the swept sphere, roughly a head, and how far short of the surface the eye is
; held so it is never flush against it.

; ETraceTypeQuery, which is an INDEX into the project's trace channels and NOT a collision
; channel number: 0 = Visibility, 1 = Camera.
; This one line is why the feature appeared not to work when it was first tried: it was set
; to 2, which is out of range, and the engine turns that into ECC_MAX - a channel nothing can
; ever block. The trace ran all session and reported no contact, which looked like a broken
; approach rather than a bad index.
; Visibility is also the correct choice on the merits: the Pawn and CharacterMesh collision
; profiles both ignore it, so your own capsule and body cannot block your view.

; --- Your own body ---------------------------------------------------------------
; UE4 visibility is per primitive, never per bone, so a first person body is always a
; compromise:
;   0 = the whole mesh is hidden. Nothing of the character is drawn, but
;       bCastHiddenShadow keeps her shadow complete and correct. No neck seam, no
;       chest clipping when you look down - and no body either.
;   1 = the body is drawn with the head bone collapsed in the skinning. The whole
;       hair chain is parented to Head and goes with it. The cost is that the shadow
;       loses its head too: nothing can drop one bone from the base pass only.
; Either way the character is restored whole during cutscenes.
; Also a row on the VR settings page, so you can compare them in the headset.
BodyMode=1

; Frames between two diagnostic lines in the UEVR log.
LogEvery=240

; --- In-game menu ---------------------------------------------------------------
; The menu is built into the game's own pause menu, as a "VR SETTINGS" entry with its
; own page. UMG is the layer UEVR projects into the headset - the one surface the game
; itself proves is visible - so the page is not drawn: it is made of the same widget
; classes the game uses, in the same widget tree, and it borrows the game's own button
; style, font and colour. It is navigated with the controller, like the rest of the
; pause menu.
;
; Rows: snap angle, smooth turn, turn speed, eye forward, eye height, yaw trim,
; show body. They
; are only read while the page is open, so the values below still apply the rest of
; the time. Changes take effect immediately but are NOT written back here, so they
; last for the session only.
;
; The widget is rebuilt on every pause, because the game creates a fresh instance
; each time it opens.
GraftPauseMenu=1

; Navigating the VR page with a thumbstick. Slate reads the left stick directly and raw it
; is unusable: a stick rests slightly off-centre, crosses Slate's own 0.5 threshold on the
; way through the middle, and repeats as fast as XInput is polled - several times per frame,
; not per tick. So the stick is filtered while this page is open, and only while it is open:
;   MenuDeadzone  below this nothing is emitted at all, which kills resting drift.
;   MenuRepeatMs  the interval between steps when the stick is held. Higher = slower.
; A push is also locked to its dominant axis, so a diagonal cannot change the highlighted
; row and the value of a slider at the same time - which was most of what made it feel
; uncontrollable. Raise both numbers if it still runs away; lower MenuRepeatMs if dragging a
; slider from one end to the other feels slow.
MenuDeadzone=0.75
MenuRepeatMs=260

; How much more the dominant axis must be than the other before a push counts as up/down or
; left/right. The chosen axis is then LATCHED until the stick returns to centre.
; Deciding it fresh on every sample is what made the page unusable: a push aimed upwards
; drifts a few degrees sideways on the way, the dominant axis flips mid-gesture, and the row
; you were only trying to move to has its value changed instead.
MenuAxisRatio=1.8

; Recentre the view when the menu is opened, so it appears in front of you.
; UEVR places the game's 2D UI relative to the view rotation the game reports, and this mod
; writes that as the snap-turn yaw alone - the headset's own yaw is added afterwards, for the
; eyes only. So the menu opens where you were facing at the last snap turn, which after a
; physical turn can be off to one side or behind you.
; OFF by default, because the cure turned out worse than the problem: recentring turns the
; world without turning the character, so she is seen from an angle she never took and looks
; to be facing sideways, and it redefines which way is forward for roomscale as well - which
; produced bodies ending up rotated ninety degrees. Set to 1 only if a menu opening off to
; one side bothers you more than that does.
MenuRecenter=1

; Fold UEVR's rotation offset into the headset yaw we read.
; UEVR's get_pose returns the RAW stage-space pose and multiplies the offset in at the point
; of use, so reading the pose alone misses every recentre. The rendered view is built with
; the offset while the character's facing was computed without it, and the two drifted apart
; by exactly the recentre angle - that was the "body ends up rotated ninety degrees" bug.
; Off only to compare against the old behaviour.
ApplyRotationOffset=1

; LAZY FOLLOW for the WHOLE interface - HUD, dialogue and pause alike, since UEVR composites
; all of it onto one plane.
;
; It works by moving the ANCHOR rather than the panel. UEVR draws the interface in stage
; space, oriented by the inverse of its rotation offset:
;   glm_matrix   = inverse(vr->get_rotation_offset());
;   glm_matrix[3] += vr->get_standing_origin();
; so the panel faces wherever that offset says, and the headset yaw we read - which folds the
; same offset in - is exactly the angle between the panel and your gaze.
;
; Turning the offset also turns the rendered view and the character, because her facing is
; built from the same terms. Adding the same angle back to the view rotation we write cancels
; both, so the world and the character stay perfectly still and only the anchor moves.
;
; HudFollowAngle is how far your gaze may drift, in degrees, before the panel eases back in
; front of you; under it nothing moves at all. 0 disables the whole thing.
; Only ever active during GAMEPLAY: a cutscene is framed by the game's own camera, which
; this mod hands back untouched, and turning the anchor underneath it rotates the shot.
; HudFollowSpeed is how quickly it closes that gap - higher is more eager, lower is calmer.
HudFollowAngle=20
HudFollowSpeed=2

; Where the correction STOPS - it is released once your gaze is within this many degrees,
; without chasing the last one. The gap between HudFollowAngle and this is the hysteresis:
; wide to start, early to stop, so a small movement after settling cannot set it off again.
; Raise it for a lazier panel that only roughly faces you, lower it to be centred more
; precisely at the cost of more movement.
HudReleaseAngle=6

; Hard ceiling, in degrees, on a single correction. A wrong rotation axis cannot then spin
; the session - the correction stops, disables itself and says so in the log. Small while the
; behaviour is being measured; raise it once it is trusted.
HudMaxTurn=60
MenuDistance=2.000000
MenuSize=1.3

; Writes the live widget tree of WBP_PauseMenu and WBP_HUD to the UEVR log - names,
; classes, visibility and child counts. UMG is the layer UEVR projects into the
; headset, so it is the one surface the game itself proves is visible; this is the
; measurement that says where a menu can be attached. Retried twice a second until
; the widgets exist, so open the pause menu once with this on.

; Logs what this build actually exposes for the articulated-arms work, once:
;   * UPoseableMeshComponent with CopyPoseFromSkeletalComponent and SetBoneTransformByName
;     - the plan is to keep the game's animated mesh hidden and driving the pose, and
;     override the arms on a visible poseable copy
;   * whether a spawned component can be made live at all (AddComponentByClass arrived
;     in 4.26 and this is 4.25, so this is the real unknown)
;   * the physics fallback: simulating the arms on the existing mesh instead
; Absence is as useful as presence, so every name is reported either way.

; Borrows a spare ArrowComponent per hand and asks UEVR's UObjectHook to drive it from
; the motion controller, then logs where the two land relative to the head bone. That
; component's world position is the target the physics arms will chase - and reading it
; from UEVR is what avoids deriving the OpenXR-to-world mapping ourselves, which is the
; largest source of error in this kind of work.
; Requires UObjectHook_EnabledAtStartup=true in the profile, which the mod now ships.

; --- Articulated arms -----------------------------------------------------------
; Needs the patch pak that carries our post-process Animation Blueprint. See
; docs\ANIMBP.md - it explains why this is the only route that works here, and what
; the editor side has to contain.
; With Arms=0 nothing is loaded: the cost is a handful of failed lookups before the
; loader gives up.

; Blend of the IK against the game's own animation, 0..1.

; Tilts the head by this many degrees through the Blueprint. It is the one number
; that separates three failures in a single launch: if the head tilts, then the pak
; mounted, the class loaded, the property was assigned, the component re-initialised,
; the instance exists and the variables are being written - so anything still wrong
; is in the IK itself. If the head does not tilt, none of that happened.
; Set 30 for the first launch, then back to 0.

; How far her hand goes compared to yours. 1.0 puts it exactly where your hand is,
; which is what VR wants: you see the virtual hand where you feel the real one. It is
; always clamped at her real reach, measured from her own bones, so the elbow never
; locks straight at something she cannot touch.
; Below 1 keeps her hands closer in; above 1 reaches further than your arm does.

; Constant correction on each wrist, in degrees. The hand bone's axes follow the rig's
; convention rather than the controller's, so some multiple of 90 is nearly always
; needed - which one cannot be worked out on paper, only seen.
;
; ONE PER SIDE, and that is not redundancy: a Mixamo rig carries MIRRORED local axes on
; its two hand bones, so the correction that squares up the right wrist puts the left
; one exactly wrong. Expect the left values to be negated or swapped, not equal.
;
; These are re-read about once a second, so you can edit this file WHILE THE GAME RUNS
; and watch a hand turn until it is right. Composition is done by the engine, not by the
; plugin: adding rotator components is not the same as composing rotations.
; These defaults were found in the headset, and the mirroring is visible in them: the
; same yaw on both sides, opposite pitch. That is the rig's two hand bones, not a mistake.

; Where the wrist sits relative to the controller, in centimetres along the CONTROLLER's
; own axes. A controller is held in the fist while the hand bone is at the wrist, so the
; two are never in the same place, and the gap is a constant - it is not an arm-length
; problem and rescaling the reach will not fix it.
; Negative forward pulls the hand back towards your wrist. Start there if the hands sit
; too far out in front of your real ones.

; The wrist correction above is composed in the plugin, through the engine's own
; ComposeRotators, and the Blueprint is sent a zero offset so its node passes the result
; through untouched. The order is fixed and no longer a setting: ComposeRotators(A, B)
; returns FQuat(B) * FQuat(A), so the correction has to be A and the controller rotation B
; for it to land in the hand's own frame. The other way round applies it in world space,
; which looked right facing one way and drifted as soon as you turned on the spot.

; Where the elbow is pushed, in centimetres, along HER OWN shoulder axis - the vector
; between her two shoulder bones - and how far below the arm.
; The first version of this used world axes, which silently assumed she always faced the
; same way; the moment she turned, "outwards" became arbitrary and the elbow often folded
; into her chest. Nothing here assumes her facing or her scale.
; Negate ArmsElbowOut to fold the elbows the other way.

; --- Movement ----------------------------------------------------------------
; The game's own layout is the default: LEFT stick moves - forward, back and strafe - and
; RIGHT stick turns. Set this to 1 to swap them, in which case the right stick moves and the
; left one turns; the swap happens once in the controller filter, before anything else reads
; the pad, and the physical left stick is then kept for turning and never reaches the game
; so it cannot walk you sideways as well.
SwapSticks=0

; Which physical button does Interact.
; The game binds Interact to Gamepad_FaceButton_Right, and which controller button the VR
; runtime puts on that is not the game's decision nor ours - in practice it lands on X, an
; awkward place for the button you press most.
; The four face buttons are read as named VR actions instead of guessed at from XInput bits,
; so this moves Interact exactly where you ask: it is cleared from wherever it was and raised
; only from your choice.
;   0 = leave the game's mapping alone
;   1 = X    2 = Y    3 = A    4 = B
InteractButton=4

; --- HUD counters -------------------------------------------------------------
; The two counters are hidden and fade in while you hold the LEFT TRIGGER, then fade out.
; The trigger is genuinely free: the game binds it to CamZoomOUT, a zoom for the third person
; camera this mod removes. The left grip would have worked too, but it carries CamReset,
; which still reaches the spring arm the script collapses every frame.
;
; Names of the widgets to fade, as they appear in the HUD's tree. Set HudProbe=1 and read the
; HUDTREE lines in the log to find them; a name matches if it appears anywhere in this list,
; so a comma-separated list is fine and so is a common prefix.
; Empty means the feature is off entirely.
;
; The two HorizontalBoxes are the counters themselves - each holds an icon and its number:
;   CanvasPanel_0
;     HorizontalBox_37    Image_0  + TextBlock_559
;     HorizontalBox_38    Image_51 + TextBlock_1 + TextBlock_563
; Naming the boxes rather than the text blocks fades the icon and the number together.
HudCounters=HorizontalBox_37,HorizontalBox_38
; How fast it fades, per second. Higher is snappier.
HudCounterFade=8

; Keep the counters on screen instead of fading them in on the trigger. This is the
; "HUD always on" toggle on the VR page, and it is saved from there like the rest.
; Off by default: the fade exists for a clear view, and this is the escape hatch for when you
; would rather just read the numbers.
HudAlwaysOn=0

; One-shot listing of the HUD's widget tree in the log, to find the names above.
; Set back to 0 once you have them.
HudProbe=0

; Centimetres the body may be moved in a single frame. A tracking glitch or a recentre can
; produce a metre at once, and teleporting the character across the room is worse than
; taking a moment to walk it. Nothing is discarded - what is left over is carried into the
; next frame.
; How quickly the body catches up to where your head is, per second. The residual is eased
; rather than closed outright, and that matters for more than the walking itself: UEVR
; anchors the game's interface panel to the STANDING ORIGIN
;   glm_matrix[3] += vr->get_standing_origin();
; and roomscale shifts that origin by however far the body just moved. Closing the whole gap
; in one frame therefore made the body hop AND the HUD twitch with it every time you shifted
; your weight. Easing makes the origin slide instead.
; Higher catches up faster and twitches more; lower is calmer but the body lags behind you.

; Which yaw maps tracking space onto the world: 0 = the snap-turn yaw, 1 = the view yaw.
; It has to be the snap yaw. The view yaw contains the headset's own rotation, which is part
; of the POSE and not of the mapping between the two spaces - using it made the direction of
; a physical step depend on where you happened to be looking.

; Shifts the standing origin by however far the body actually travelled, so a step does not
; count twice - once because you moved in the room, and again because the character moved
; under you. Against a wall the body stops, the origin barely moves, and leaning past the
; wall cannot drag the view through it.
